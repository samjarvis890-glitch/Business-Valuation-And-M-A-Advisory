<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" width="340" height="56" fill="none" role="img" aria-label="Northbridge Valuation &amp; Advisory">
  <defs>
    <linearGradient id="nbGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E7E45"/>
      <stop offset="50%" stop-color="#B99A62"/>
      <stop offset="100%" stop-color="#D8BE8A"/>
    </linearGradient>
    <linearGradient id="nbNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172B4D"/>
      <stop offset="100%" stop-color="#101E35"/>
    </linearGradient>
  </defs>

  <!-- Monogram Mark -->
  <g transform="translate(4, 4)">
    <!-- N Left Pillar -->
    <rect x="2" y="4" width="7" height="40" rx="2" fill="url(#nbNavyGrad)" />
    
    <!-- N Diagonal / Arch with Bridge Span -->
    <path d="M9 10 L29 38" stroke="url(#nbNavyGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- N Right Pillar -->
    <rect x="29" y="4" width="7" height="40" rx="2" fill="url(#nbNavyGrad)" />

    <!-- Rising Gold Growth Bars -->
    <rect x="13" y="32" width="3" height="12" rx="1" fill="url(#nbGoldGrad)" />
    <rect x="18" y="25" width="3" height="19" rx="1" fill="url(#nbGoldGrad)" />
    <rect x="23" y="18" width="3" height="26" rx="1" fill="url(#nbGoldGrad)" />

    <!-- Bridge-Inspired Gold Arc -->
    <path d="M1 42 Q 19 14, 37 42" fill="none" stroke="url(#nbGoldGrad)" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="19" cy="14" r="2.2" fill="#D8BE8A" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(54, 0)">
    <!-- NORTHBRIDGE -->
    <text x="0" y="29" font-family="'DM Serif Display', Georgia, serif" font-size="22" font-weight="700" fill="#172B4D" letter-spacing="1.8">NORTHBRIDGE</text>
    <!-- VALUATION & ADVISORY -->
    <text x="1" y="45" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.8" font-weight="600" fill="#B99A62" letter-spacing="3.4">VALUATION &amp; ADVISORY</text>
  </g>
</svg>